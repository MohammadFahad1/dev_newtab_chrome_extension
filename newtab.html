<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="home.png">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>

  <div id="background"></div>
  <div class="noise"></div>

  <div class="container">
    <div class="glass-card">

      <!-- Header -->
      <div class="header">
        <div class="logo">
          <div class="avatar-small">
            <span style="color:#4ade80; font-size:18px;">👨‍💻</span>
          </div>
          <div class="name">Md. Fahad Monshi</div>
        </div>
        <div id="live-time"></div>
      </div>

      <!-- Profile -->
      <div class="profile">
        <div class="big-avatar">
          <img src="me.jpg" id="profile-img" alt="Md. Fahad Monshi">
        </div>

        <div class="greeting" id="greeting">Welcome, Fahad</div>
        <div class="subtitle">
          Full Stack Developer <span style="color:#4ade80;">•</span> Dhaka, Bangladesh
        </div>
        <div class="description">
          Passionate about building scalable web applications with Python, Django, React & Next.js.
        </div>
      </div>

      <!-- Social Links -->
      <div class="social-grid">

        <!-- Facebook -->
        <a href="https://facebook.com/MdFahad.index" class="social-link">

          <div class="social-name">Facebook</div>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/fahad4bd" class="social-link">
          <div class="icon-wrapper" style="background: linear-gradient(135deg, #f56040, #c13584); color:white;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
          </div>
          <div class="social-name">Instagram</div>
        </a>

        <!-- LinkedIn -->
        <a href="https://linkedin.com/in/fahad4bd" class="social-link">
          <div class="icon-wrapper" style="background: rgba(10,102,194,0.15); color:#0A66C2;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 11v5M8 7v.01"/><path d="M12 11v5M12 7v.01"/><path d="M16 11v5"/></svg>
          </div>
          <div class="social-name">LinkedIn</div>
        </a>

        <!-- X (Twitter) -->
        <a href="https://x.com/bd_fahad" class="social-link">
          <div class="icon-wrapper" style="background: rgba(255,255,255,0.1); color:white;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.153h7.594l5.243 6.932L18.9 1.153z"/></svg>
          </div>
          <div class="social-name">X</div>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/MohammadFahad1" class="social-link">
          <div class="icon-wrapper" style="background: rgba(255,255,255,0.1); color:white;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577 0-.285-.01-1.044-.015-2.051-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.652 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.604-.015 2.897-.015 3.293 0 .322.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </div>
          <div class="social-name">GitHub</div>
        </a>

        <!-- Discord -->
        <a href="https://discord.com/users/fahad4bd" class="social-link">
          <div class="icon-wrapper" style="background: rgba(88,101,242,0.15); color:#5865F2;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.078.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.078-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 6.758-.32 12.5.1 18.167a.068.068 0 0 0 .027.047c2.052 1.51 4.04 2.423 5.992 3.029.3.058.613-.022.84-.19a13.008 13.008 0 0 0 1.19-.872.068.068 0 0 0 .006-.1 10.3 10.3 0 0 1-.378-.372.075.075 0 0 1 .01-.103 17.85 17.85 0 0 0 1.11-1.58.074.074 0 0 1 .066-.027c3.32.48 6.7.48 9.99 0a.074.074 0 0 1 .066.027c.36.53.74 1.046 1.11 1.58a.075.075 0 0 1 .01.103c-.14.13-.28.263-.378.372a.068.068 0 0 0 .005.1c.3.21.615.29.84.19 1.952-.606 3.94-1.52 5.992-3.03a.068.068 0 0 0 .027-.047z"/></svg>
          </div>
          <div class="social-name">Discord</div>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/01793006019" class="social-link">
          <div class="icon-wrapper" style="background: rgba(37,211,102,0.15); color:#25D366;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.485-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.297-.446.1-.149.05-.298-.05-.446-.099-.148-.67-.91-.92-1.255-.25-.345-.503-.29-.67-.29-.168 0-.346 0-.52.15-.173.15-.704.545-.704 1.29 0 .746.71 1.49.81 1.59.1.1 1.34 2.03 3.24 2.83.99.62 1.45.78 1.98.81.4.04.66.03.91-.02.25-.05.77-.32 1.13-.59.36-.27.72-.74.9-1.1.18-.36.24-.72.2-.9-.04-.18-.18-.34-.35-.46z"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
          </div>
          <div class="social-name">WhatsApp</div>
        </a>

        <!-- Teams -->
        <a href="https://teams.microsoft.com" class="social-link">
          <div class="icon-wrapper" style="background: rgba(0,180,255,0.15); color:#00B4FF;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 2H6.5C4.843 2 3.5 3.343 3.5 5V19C3.5 20.657 4.843 22 6.5 22H17.5C19.157 22 20.5 20.657 20.5 19V5C20.5 3.343 19.157 2 17.5 2H12.5Z"/><path d="M9 11H15V17H9V11Z"/></svg>
          </div>
          <div class="social-name">Teams</div>
        </a>

        <!-- Gmail -->
        <a href="https://mail.google.com" class="social-link">
          <div class="icon-wrapper" style="background: rgba(234,67,53,0.15); color:#EA4335;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z"/></svg>
          </div>
          <div class="social-name">Gmail</div>
        </a>

      </div>

      <!-- Footer -->
      <div class="footer">
        <div>© 2026 Md. Fahad Monshi</div>
        <div class="status">
          <div class="dot"></div>
          <span>Ready to collaborate</span>
        </div>
      </div>

    </div>

    <!-- Task Manager Card -->
    <div class="glass-card todo-card" style="min-height: 100vh;">
      <div class="todo-header-row">
        <div class="todo-title" style="margin-bottom: 0;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </div>
        <button id="manage-clients-btn" class="icon-btn" title="Manage Clients">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </button>
      </div>
      
      <div class="todo-input-container">
        <select id="todo-client" class="todo-client-input">
          <option value="">Select Client</option>
        </select>
        <input type="text" id="todo-task" class="todo-input" placeholder="What needs to be done?" autocomplete="off" />
        <button type="button" id="add-todo-btn" class="add-todo-btn" title="Add Task">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <div class="todo-list-wrapper">
        <div class="todo-list" id="todo-list">
          <!-- Todo items will be populated here by JS -->
        </div>
      </div>
    </div>

  </div>

  <!-- Clients Modal -->
  <div id="clients-modal" class="modal-overlay hidden">
    <div class="glass-card modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Manage Clients</h2>
        <div style="display: flex; gap: 8px;">
          <button id="toggle-client-form-btn" class="icon-btn" title="Add Client">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="close-clients-btn" class="icon-btn">&times;</button>
        </div>
      </div>
      
      <div id="client-form-container" class="client-form-container hidden">
        <input type="hidden" id="client-id" />
        <div style="display: flex; gap: 12px; width: 100%;">
          <input type="text" id="client-name" class="modal-input" placeholder="Client Name" autocomplete="off" />
          <input type="number" id="client-amount" class="modal-input" placeholder="Amount ($)" autocomplete="off" />
        </div>
        <div style="display: flex; gap: 12px; width: 100%;">
          <input type="date" id="client-date" class="modal-input" title="Delivery Date (Optional)" />
          <select id="client-status" class="modal-input" style="cursor: pointer;">
            <option value="" style="color: #25D366">No Status</option>
            <option value="Pending" style="color: #000000">Pending</option>
            <option value="In Progress" style="color: #000000">In Progress</option>
            <option value="Delivered" style="color: #000000">Delivered</option>
          </select>
        </div>
        <input type="text" id="client-note" class="modal-input" placeholder="Note (Optional)" style="width: 100%;" autocomplete="off" />
        <div style="display: flex; gap: 12px; width: 100%; align-items: center; margin-top: 4px;">
          <label class="modal-checkbox-label" style="flex: 1;">
            <input type="checkbox" id="client-active" class="todo-checkbox" checked> Active
          </label>
          <button type="button" id="cancel-client-btn" class="icon-btn hidden" style="width: auto; padding: 0 12px; font-size: 14px;">Cancel</button>
          <button type="button" id="save-client-btn" class="add-todo-btn" style="width: auto; padding: 10px 20px; font-weight: 600;">Save</button>
        </div>
      </div>

      <div class="clients-list-wrapper">
        <div class="clients-list" id="clients-list">
          <!-- Client items will be populated here by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
